<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Ecoeventos</title>
        <link rel="stylesheet" href="css/estilo.css">
    </head>
    <body>
        <header>
            <h1>Sistema de Registro con Persistencia "EcoEventos"</h1>
        </header>
        <main>
            <div id="caja">
                <form id="formulario" action="/confirmar" method="post">

                    <div>
                        <label for="nombre">Nombre completo: </label>
                        <input id="nombre" name="nombre" type="text" placeholder="Ej. Walter Casia">
                        <br>
                    </div>

                    <div>
                        <label for="correo">Correo Electronico: </label>
                        <input id="correo" name="correo" type="email" placeholder="ejemplo@gmail.com">
                        <br>
                    </div>
                    
                    <button type="submit">Enviar</button>
                </form>

                <h3>Ver historial de asistencias</h3>
                <a href="/asistencias">
                <button>Asistencias</button>
                </a>
            </div>
        </main>
    </body>

</html>
