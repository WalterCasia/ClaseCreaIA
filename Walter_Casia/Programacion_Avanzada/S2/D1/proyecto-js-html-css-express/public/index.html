<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Pagian web de integracion</title>
        <link rel="stylesheet" href="css/estilos.css">
    </head>
    <body>
        <header>
            <h1>Sitio de integracion de las nuevas tecnologias</h1>
            <div class="caja-conexion">
                <h2>Identificacion de usuario</h2>

                <form id="formulario" action="/enviar_datos" method="post">
                    <label for="nombre">Nombre: </label>
                    <input id="" name="nombre" type="text" placeholder="Ej. Walter">
                    <br>

                    <label for="id">ID de usuario: </label>
                    <input id="id" name="id" type="text" placeholder="123abc">
                    <br>

                    <button>Enviar</button>

                </form>
            </div>
        </header>
    </body>
</html>
