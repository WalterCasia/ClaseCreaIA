<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Poyecto integrador</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Proyecto integrador</h1>
        </header>
        <main>
            <div class="caja">
            <form id="formulario" action="/datos" method="post">
                <div>
                    <label for="nombre">Nombre: </label>
                    <br>
                    <input id="nombre" name="nombre" type="text" placeholder="Walter">

                </div>

                <div>
                    <label for="apellido">Apellido: </label>
                    <br>
                    <input id="apellido" name="apellido" type="text" placeholder="Casia">
                    
                </div>
                
                <div>
                    <br>
                <button type="submit">Enviar</button>
                </div>

            </form>
            </div>
        </main>
    </body>
</html>
